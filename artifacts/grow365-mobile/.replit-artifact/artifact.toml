kind = "mobile"
previewPath = "/"
title = "Grow365"
description = "A calm, accessible devotional and spiritual journaling mobile app. This first version establishes the complete navigation skeleton, account and onboarding flows, main tab structure, supporting screens, light and dark themes, and typography system without implementing product features or changing the existing Supabase schema."
version = "1.0.0"
id = "artifacts/grow365-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20521

[services.development]
run = "pnpm --filter @workspace/grow365-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grow365-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/grow365-mobile", "run", "serve" ]

[services.env]
PORT = "20521"
BASE_PATH = "/"
